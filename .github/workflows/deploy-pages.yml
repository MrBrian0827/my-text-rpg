name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 從 Secret 產生 config.js（不寫入 repo）
        env:
          ACCESS_CODE: ${{ secrets.ACCESS_CODE }}
        run: |
          if [ -z "$ACCESS_CODE" ]; then
            echo "錯誤：請在 GitHub Settings → Secrets → Actions 新增 ACCESS_CODE"
            exit 1
          fi
          node -e "
            const fs = require('fs');
            const normalize = (value) => String(value ?? '')
              .normalize('NFKC')
              .replace(/[\u200B-\u200D\uFEFF]/g, '')
              .trim();
            const code = normalize(process.env.ACCESS_CODE);
            if (!code) {
              throw new Error('ACCESS_CODE 正規化後為空，請檢查 Secret 內容');
            }
            const content = '// auto-generated by GitHub Actions\n'
              + 'const ACCESS_CODE = ' + JSON.stringify(code) + ';\n'
              + 'const ACCESS_CODE_META = ' + JSON.stringify({ generatedAt: new Date().toISOString() }) + ';\n';
            fs.writeFileSync('js/config.js', content);
          "

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - uses: actions/deploy-pages@v4
        id: deployment
