name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 從 Secret 產生 config.js（不寫入 repo）
        env:
          ACCESS_CODE: ${{ secrets.ACCESS_CODE }}
        run: |
          if [ -z "$ACCESS_CODE" ]; then
            echo "錯誤：請在 GitHub Settings → Secrets → Actions 新增 ACCESS_CODE"
            exit 1
          fi
          printf '%s\n' \
            '// 此檔由 GitHub Actions 自動產生，請勿手動編輯' \
            "// 密碼存放於 Repository Secrets，不會出現在 git 紀錄" \
            "const ACCESS_CODE = '${ACCESS_CODE}';" \
            > js/config.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - uses: actions/deploy-pages@v4
        id: deployment
