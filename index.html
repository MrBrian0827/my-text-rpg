<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>夜旅筆記</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+TC:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- 私人存取碼驗證 -->
    <section id="gate-panel" class="gate-view">
        <div class="gate-view__inner">
            <h1>夜旅筆記</h1>
            <p class="gate-lead">私人連載，請輸入存取碼。</p>
            <form onsubmit="handleUnlock(event)">
                <label for="gate-code">存取碼</label>
                <input type="password" id="gate-code" placeholder="你的私人密碼" autocomplete="off" required>
                <label class="gate-remember">
                    <input type="checkbox" id="gate-remember" checked>
                    記住此裝置（下次免輸入）
                </label>
                <p id="gate-error" class="gate-error" hidden></p>
                <button type="submit" class="btn-write">進入</button>
            </form>
        </div>
    </section>

    <div id="app-content" class="app-frame" hidden>

        <header class="top-bar">
            <div class="top-bar__title">
                <h1>夜旅筆記</h1>
                <span class="top-bar__sub">私人連載 · 僅供作者自用</span>
            </div>
        </header>

        <section id="setup-panel" class="setup-view">
            <div class="setup-view__inner">
                <p class="setup-lead">這是一本只屬於你的連載筆記。寫下世界與主角，AI 會以散文方式續寫——你再用自己的話決定下一步。</p>

                <label for="apiKey">Gemini API 金鑰</label>
                <input type="password" id="apiKey" placeholder="AIzaSy…" autocomplete="off">
                <p class="field-note">金鑰僅存於本次瀏覽器記憶體，不寫入 localStorage。<a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">申請金鑰</a></p>

                <label for="worldSetting">故事舞台</label>
                <textarea id="worldSetting" rows="3" placeholder="時間、地點、氛圍……例如：雨季中的海港城市，燈火與迷霧交織。"></textarea>

                <label for="playerClass">主角是誰</label>
                <input type="text" id="playerClass" placeholder="例如：剛辭職的檔案管理員、四處寄信的旅人">

                <button type="button" class="btn-write" onclick="startAdventure()">寫下第一頁</button>
            </div>
        </section>

        <section id="game-panel" class="journal-view" hidden>

            <div class="status-bar">
                <span class="mood-tag" id="mood-text">—</span>
                <div class="status-pills">
                    <span class="pill">精力 <b id="energy">—</b></span>
                    <span class="pill">靈感 <b id="insight">—</b></span>
                    <span class="pill">信譽 <b id="rapport">—</b></span>
                    <span class="pill">積蓄 <b id="savings">—</b></span>
                </div>
            </div>

            <div id="narrative-log" class="narrative-log" aria-live="polite"></div>

            <form id="action-form" class="action-form" onsubmit="submitAction(event)">
                <label for="player-action" class="sr-only">你的下一步</label>
                <textarea id="player-action" rows="2" placeholder="用一句話或一段話描述主角接下來想做什麼……" required></textarea>
                <button type="submit" class="btn-write" id="submit-btn">續寫</button>
            </form>

        </section>

    </div>

    <script src="js/config.js?v=8"></script>
    <script src="js/gate.js?v=8"></script>
    <script src="js/api.js?v=8"></script>
    <script src="js/system.js?v=8"></script>
    <script src="js/app.js?v=8"></script>
</body>
</html>
