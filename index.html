<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>萬能 AI 文字冒險產生器 - 核心大專案</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <h1>⚔️ 萬能 AI 文字冒險產生器 (模組化防外洩版)</h1>
    
    <!-- 初始自由設定面板 -->
    <div id="setup-panel" class="panel">
        <h3>🔑 創造你的世界與角色</h3>
        
        <label>1. Gemini API 金鑰：</label>
        <input type="password" id="apiKey" placeholder="請貼上你的 API 金鑰 (AIzaSy...)">
        <p style="font-size:12px; color:#888; margin-top:-8px; margin-bottom:12px;">※ 金鑰僅會安全地儲存於您的本機瀏覽器（localStorage），絕不上傳至 GitHub。</p>
        
        <label>2. 想像你的世界觀 (自由填寫)：</label>
        <textarea id="worldSetting" rows="3" placeholder="例如：2026年的台北街頭，突然爆發了不明的喪屍病毒...&#10;或是：一個充滿霓虹燈與義體改造的賽博朋克極道都市..."></textarea>

        <label>3. 填寫你的初始職業/身份 (自由填寫)：</label>
        <input type="text" id="playerClass" placeholder="例如：半夜還在送餐的熊貓外送員 / 駭客 / 退役特種兵">
        
        <button onclick="startAdventure()" style="background:#28a745;">🎲 覺醒身份！開始全新冒險</button>
    </div>

    <!-- 遊戲主畫面 (預設隱藏) -->
    <div id="game-panel" class="panel" style="display:none;">
        <div class="status-grid">
            <div style="color:#ff4d4d;">❤️ HP: <span id="hp">???</span></div>
            <div style="color:#ffcc00;">⚔️ 攻擊: <span id="atk">???</span></div>
            <div style="color:#28a745;">🛡️ 防禦: <span id="def">???</span></div>
            <div style="color:#00e6ff;">💰 金幣: <span id="gold">???</span></div>
        </div>
        
        <h3>📜 當前遭遇事件</h3>
        <div id="story-text"></div>

        <h3>🎯 抉擇行動選項</h3>
        <div id="options-container"></div>
    </div>
</div>

<!-- 引入模組指令，注意順序：通訊與狀態最先，主控程式最後 -->
<script src="js/api.js"></script>
<script src="js/system.js"></script>
<script src="js/app.js"></script>
</body>
</html>
