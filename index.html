<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邊境紀事 · AI 文字冒險</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="bg-pattern" aria-hidden="true"></div>

    <header class="site-header">
        <div class="brand">
            <span class="brand-mark">BC</span>
            <div>
                <h1>邊境紀事</h1>
                <p class="tagline">Border Chronicles · 單人 AI 文字冒險</p>
            </div>
        </div>
    </header>

    <main class="app-shell">

        <!-- 開局設定 -->
        <section id="setup-panel" class="card setup-card">
            <div class="card-head">
                <span class="step-badge">START</span>
                <h2>撰寫你的第一章</h2>
                <p class="card-desc">設定世界與角色，AI 說書人將依你的想像展開旅程。</p>
            </div>

            <div class="form-block">
                <label for="apiKey">API 金鑰</label>
                <input type="password" id="apiKey" placeholder="貼上 Gemini API 金鑰（AIzaSy…）" autocomplete="off">
                <p class="hint">金鑰僅存於本次遊戲記憶體，不寫入 localStorage。至 <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a> 免費申請。</p>
            </div>

            <div class="form-block">
                <label for="worldSetting">世界背景</label>
                <textarea id="worldSetting" rows="4" placeholder="例如：霧氣繚繞的邊境城邦、古代遺跡與盜賊公會並存的破碎大陸…"></textarea>
            </div>

            <div class="form-block">
                <label for="playerClass">角色身分</label>
                <input type="text" id="playerClass" placeholder="例如：見習學者 / 流浪傭兵 / 村莊守夜人">
            </div>

            <button type="button" class="btn-primary" onclick="startAdventure()">擲骰，踏上旅途</button>
        </section>

        <!-- 遊戲進行中 -->
        <section id="game-panel" class="game-layout" hidden>

            <aside class="stat-panel card">
                <h2 class="stat-title">角色狀態</h2>
                <ul class="stat-list">
                    <li class="stat-item stat-hp">
                        <span class="stat-label">生命</span>
                        <span class="stat-value" id="hp">—</span>
                    </li>
                    <li class="stat-item stat-atk">
                        <span class="stat-label">攻擊</span>
                        <span class="stat-value">+<span id="atk">—</span></span>
                    </li>
                    <li class="stat-item stat-def">
                        <span class="stat-label">防禦</span>
                        <span class="stat-value" id="def">—</span>
                    </li>
                    <li class="stat-item stat-gold">
                        <span class="stat-label">財產</span>
                        <span class="stat-value"><span id="gold">—</span> G</span>
                    </li>
                </ul>
            </aside>

            <div class="play-panel">
                <div class="card narrative-card">
                    <div class="card-head compact">
                        <span class="step-badge">LOG</span>
                        <h2>旅途紀錄</h2>
                    </div>
                    <div id="story-text" class="story-body"></div>
                </div>

                <div class="card choices-card">
                    <div class="card-head compact">
                        <span class="step-badge">ACT</span>
                        <h2>下一步</h2>
                    </div>
                    <div id="options-container" class="choices-list"></div>
                </div>
            </div>

        </section>

    </main>

    <footer class="site-footer">
        <p>本作品為個人非商業學習專案，與任何付費產品無關。D&D 等商標屬其權利人所有。</p>
    </footer>

    <script src="js/api.js?v=6"></script>
    <script src="js/system.js?v=6"></script>
    <script src="js/app.js?v=6"></script>
</body>
</html>
